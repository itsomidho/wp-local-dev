; PHP-FPM pool tuning for local development, mounted into every PHP container.
; The image default is 5 workers, so a WordPress admin screen (the page plus
; admin-ajax, REST and cron requests at the same time) queues behind itself.
; The machine has plenty of cores; workers are only started when needed.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle a worker now and then so a leaky plugin can't grow one forever.
pm.max_requests = 500
