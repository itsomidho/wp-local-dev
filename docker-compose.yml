services:
  # MySQL Database (Shared across all sites)
  mysql:
    image: mysql:8.0
    container_name: wp-mysql
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MYSQL_PORT:-39000}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wp_mysql_data:/var/lib/mysql
    networks:
      - network

  # Redis (Shared object cache for all sites — see php/Dockerfile for the
  # phpredis extension, and `wpdev add` for per-site setup). Purely a cache,
  # not a datastore — no volume, a cache miss just costs a slower page load.
  redis:
    image: redis:alpine
    container_name: wp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-39001}:6379"
    networks:
      - network

  # Mailpit (catches every outgoing email from every site — see
  # php/msmtprc + php/mail.ini for how PHP is wired to relay here)
  mailpit:
    image: axllent/mailpit
    container_name: wp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-39004}:8025"
      - "${MAILPIT_SMTP_PORT:-39005}:1025"
    networks:
      - network

  # Portainer (Docker container/image management UI)
  #
  # NOTE: this mounts the host's docker.sock, which gives Portainer — and
  # anyone who can reach its UI — full control of your ENTIRE Docker daemon,
  # not just this project's containers. That's how Portainer works; it's not
  # scoped to this compose project. First visit to
  # http://localhost:${PORTAINER_PORT:-39003} asks for a one-time setup token —
  # get it with `docker logs wp-portainer` — then you create your own admin
  # account.
  portainer:
    image: portainer/portainer-ce:latest
    container_name: wp-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-39003}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wp_portainer_data:/data
    networks:
      - network

  # Adminer (Shared database management)
  adminer:
    image: adminer
    container_name: wp-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-39002}:8080"
    environment:
      # Prefills the login form's Server field with our mysql service name —
      # this image only reads it from the env, not from a URL query param.
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - network

  # PHP-FPM — one service per supported PHP version, so each site can pick
  # its own at creation time (`wpdev add`). All share the same ./sites, since
  # which container actually handles a given site is entirely down to which
  # one its Nginx vhost points at (PHP_UPSTREAM) — Nginx routing decides,
  # not filesystem access. php82 is the default and carries a `php` network
  # alias so existing vhosts created before multi-PHP support (which say
  # `fastcgi_pass php:9000` literally) keep resolving with zero changes.
  php81: &php-fpm
    build:
      context: .
      dockerfile: php/Dockerfile
      network: host
      args:
        PHP_VERSION: "8.1"
        # Only set if your network needs a proxy to reach the internet during
        # the build (e.g. to download wp-cli/PECL extensions). Leave HTTP_PROXY
        # unset in .env and these are empty — no proxy is used.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-php81
    restart: unless-stopped
    volumes:
      - ./sites:/var/www
      - ./php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./php/mail.ini:/usr/local/etc/php/conf.d/mail.ini
      - ./php/msmtprc:/etc/msmtprc
      - ./php/wp-cron-runner.sh:/usr/local/bin/wp-cron-runner.sh
      - ./logs:/var/log/wpdev
      # Shared with nginx so the nginx-helper plugin can unlink a site's own
      # cached pages directly on post save (see `wpdev cache`) -- its
      # "unlink files" purge method needs real filesystem access to the
      # same cache nginx writes to, not just an HTTP call.
      - wp_fastcgi_cache:/var/cache/nginx/fastcgi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network
    depends_on:
      - mailpit

  php82:
    <<: *php-fpm
    build:
      context: .
      dockerfile: php/Dockerfile
      network: host
      args:
        PHP_VERSION: "8.2"
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-php82
    networks:
      network:
        aliases:
          - php

  php83:
    <<: *php-fpm
    build:
      context: .
      dockerfile: php/Dockerfile
      network: host
      args:
        PHP_VERSION: "8.3"
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-php83

  php84:
    <<: *php-fpm
    build:
      context: .
      dockerfile: php/Dockerfile
      network: host
      args:
        PHP_VERSION: "8.4"
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-php84

  # Nginx (Shared reverse proxy for all sites)
  nginx:
    image: nginx:alpine
    container_name: wp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./sites:/var/www
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/sites
      # Named (not container-local) specifically so the phpXX containers
      # can share it too -- see their own volumes for why.
      - wp_fastcgi_cache:/var/cache/nginx/fastcgi
    depends_on:
      - php81
      - php82
      - php83
      - php84
    networks:
      - network

  # Thin HTTP API wrapping `wpdev` 1:1 -- no reimplemented logic, every
  # endpoint execs or streams the real wpdev subcommand. Exists so a GUI (or
  # anything else) can drive this stack without a shell. See the README's
  # "API service" section.
  #
  # Docker-outside-of-Docker: this container has no Docker daemon of its
  # own -- it talks to the HOST's daemon over the bind-mounted socket (same
  # pattern as Portainer above), then runs `./wpdev`, which itself shells
  # out `docker compose ...`. That INNER `docker compose` CLI resolves this
  # file's relative volume paths (./sites, ./nginx, etc.) against its own
  # cwd, but the resulting container-create request is serviced by the HOST
  # daemon, which has no idea this container's filesystem even exists -- it
  # only knows real host paths. Mounting the project here at the SAME
  # absolute path it has on the host (${PROJECT_DIR}, kept in .env by
  # `wpdev up`) makes that "wrong" in-container path and the real host path
  # resolve to identical content, so the host daemon's bind mounts land
  # correctly either way. This only works when this service is (re)created
  # via `wpdev up` -- running `docker compose up` directly from a shell
  # sitting somewhere else would use whatever PROJECT_DIR is already in
  # .env, which is fine as long as it's ever been set by `wpdev up` once,
  # but won't self-correct if the directory moved since.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # Host network namespace for the build, exactly as the php images do
      # above. Not an optimisation -- it's what makes the build work at all
      # on a machine whose container DNS is unusable: a bridge-network build
      # inherits a resolver it may not be able to reach (a VPN's, routed
      # through a tunnel that bridge traffic never enters), while a host-netns
      # build resolves the way every other process on the machine does. It's
      # also the only way the HTTP_PROXY below can refer to 127.0.0.1, which
      # is what .env.example suggests: on a bridge network that address is the
      # build container itself, not the host's proxy.
      network: host
      args:
        # Same build-time proxy the php images get (see .env). Docker treats
        # these four names as predefined build args, so apt and npm inside
        # the build pick them up without the Dockerfile declaring anything.
        # Left out for a long time, which is why `npm ci` here would time out
        # on a network where the php builds -- going through the proxy --
        # were fine.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-api
    restart: unless-stopped
    env_file: .env
    environment:
      CAROOT: /mkcert-ca
      PROJECT_DIR: ${PROJECT_DIR}
      API_UID: ${API_UID:-1000}
      API_GID: ${API_GID:-1000}
      DOCKER_GID: ${DOCKER_GID:-}
      # Tells wpdev it's running inside this container, so up/restart/down/
      # update leave wp-api itself alone (see stack_services in wpdev).
      WPDEV_IN_API: "1"
    ports:
      # 127.0.0.1-only -- this service can delete sites and drop databases
      # on a bare HTTP call (plus whatever auth API_TOKEN adds on top; see
      # .env.example). Never remove this binding without real auth in front.
      - "127.0.0.1:${API_PORT:-39006}:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and safe to overlay Docker's own auto-managed /etc/hosts
      # with the host's real one -- container-to-container name resolution
      # (mysql, php82, ...) goes through Docker's embedded DNS (127.0.0.11),
      # not /etc/hosts, so this only affects doctor's "/etc/hosts entry
      # present" check, making it reflect the real host state instead of
      # this container's own near-empty /etc/hosts.
      - /etc/hosts:/etc/hosts:ro
      - ${PROJECT_DIR}:${PROJECT_DIR}
      # Falls back to a container-local named volume (its own untrusted CA,
      # but still a valid cert nginx will happily load) when MKCERT_CAROOT
      # isn't set. Set MKCERT_CAROOT to your host's `mkcert -CAROOT` output
      # to share its already-browser-trusted CA instead.
      - ${MKCERT_CAROOT:-wp_api_mkcert_ca}:/mkcert-ca
    networks:
      - network

  # Static React dashboard (dashboard/), talking straight to the `api`
  # service from the browser (that's why `api` needs CORS enabled, not this
  # container) -- this is just nginx serving the Vite build, plus a tiny
  # config.js regenerated from API_PORT on every start (see
  # dashboard/docker-entrypoint.sh) so changing that port doesn't need a
  # rebuild.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      # Host network namespace for the build, exactly as the php images do
      # above. Not an optimisation -- it's what makes the build work at all
      # on a machine whose container DNS is unusable: a bridge-network build
      # inherits a resolver it may not be able to reach (a VPN's, routed
      # through a tunnel that bridge traffic never enters), while a host-netns
      # build resolves the way every other process on the machine does. It's
      # also the only way the HTTP_PROXY below can refer to 127.0.0.1, which
      # is what .env.example suggests: on a bridge network that address is the
      # build container itself, not the host's proxy.
      network: host
      args:
        # Same build-time proxy the php images get (see .env). Docker treats
        # these four names as predefined build args, so apt and npm inside
        # the build pick them up without the Dockerfile declaring anything.
        # Left out for a long time, which is why `npm ci` here would time out
        # on a network where the php builds -- going through the proxy --
        # were fine.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    container_name: wp-dashboard
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-39006}
      # Set by `wpdev up` (git describe) on every start -- see wpdev's
      # cmd_up. Falls back here only if .env predates this var entirely.
      APP_VERSION: ${APP_VERSION:-unknown}
      # So site links carry the port when nginx isn't on 443 (#5).
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    ports:
      # 127.0.0.1-only, same reasoning as `api` -- this is just the UI, but
      # there's no reason to expose it further than the API it drives.
      - "127.0.0.1:${DASHBOARD_PORT:-39007}:80"
    networks:
      - network

volumes:
  wp_mysql_data:
    driver: local
  wp_portainer_data:
    driver: local
  wp_fastcgi_cache:
    driver: local
  wp_api_mkcert_ca:
    driver: local

networks:
  network:
    driver: bridge
