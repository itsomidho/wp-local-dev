name: Smoke test

# Provisions a real site end-to-end against the actual stack and exercises
# the exact failure classes found by hand during development: cron running
# a site under the wrong PHP version, `clone` leaving an invalid nginx
# vhost, and nginx caching a stale upstream IP after a phpXX container
# restart. A green run here is a real guarantee those don't regress --
# every prior incident in this list was first caught by someone manually
# poking at a live stack, not by anything automatic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up .env
        run: cp .env.example .env

      - name: Install mkcert and trust the local CA
        run: ./wpdev install-mkcert

      - name: >
          Start the stack (also builds+starts the api service, and syncs
          PROJECT_DIR/API_UID/API_GID/DOCKER_GID into .env that it needs)
        run: ./wpdev up

      - name: Provision a test site (domain, PHP version, WP version, continue, skip /etc/hosts)
        # Checks for the success line, not just the exit code: a cancelled
        # add now exits non-zero (#7), but a shifted piped answer could
        # still land somewhere that doesn't cancel.
        run: |
          out=$(printf 'citest.test\n8.2\n\ny\nn\n' | ./wpdev add 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qi "citest.test is ready"

      - name: Site responds over HTTPS
        # Retries: curl can hit a transient SSL-connect error (exit 35) in
        # the few seconds right after cert generation + nginx reload --
        # seen for real in CI once, on a commit that touched nothing but
        # completions/README, confirming it was a startup race, not a
        # regression. Same reasoning as wait_for_mysql's retry loop.
        run: |
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code"
          [ "$code" = "200" ]

      - name: doctor reports no failures
        # Not "Everything checks out": `wpdev up` above means every
        # container (including adminer/portainer/api) is running, but the
        # /etc/hosts entry is still deliberately skipped (curl --resolve is
        # used instead throughout this file), which doctor correctly
        # reports as a warning, not a failure. Asserting on the absence of
        # "need fixing" (only printed when fails > 0) checks what's
        # actually meaningful here.
        run: ./wpdev doctor | tee /tmp/doctor.log; ! grep -q "thing(s) need fixing" /tmp/doctor.log

      - name: Redis object cache connected
        run: ./wpdev wp citest redis status | grep -q "Connected"

      - name: Default plugins adjusted (hello/akismet removed, dev plugins active)
        run: |
          plugins=$(./wpdev wp citest plugin list --field=name --status=active)
          echo "$plugins"
          echo "$plugins" | grep -qx "query-monitor"
          echo "$plugins" | grep -qx "wp-crontrol"
          ! ls sites/citest/wp-content/plugins/ | grep -qx "hello"
          ! ls sites/citest/wp-content/plugins/ | grep -qx "akismet"

      - name: >
          Regression test -- a site must still provision and become
          reachable even if redis-cache/query-monitor/wp-crontrol all
          fail to install. Each had the exact same unguarded set -e
          failure as nginx-helper's (found by re-reading the code, never
          actually exercised until this test) -- nginx never got brought
          up until after these installs, so any one of them failing
          aborted provisioning entirely, leaving an unreachable site.
          A separate throwaway site, not citest -- its own plugin state
          is checked by other steps and shouldn't be disturbed.
        run: |
          # wp-cli runs as www-data (#20), whose cache is under its home,
          # /var/www; root's is cleared too for older images.
          docker exec wp-php82 sh -c 'rm -rf /root/.wp-cli/cache/plugin/ "$(getent passwd www-data | cut -d: -f6)/.wp-cli/cache/plugin/"'
          docker exec wp-php82 sh -c "echo '127.0.0.1 wordpress.org downloads.wordpress.org' >> /etc/hosts"

          out=$(printf 'depfail.test\n8.2\n\ny\nn\n' | ./wpdev add 2>&1)
          echo "$out"
          echo "$out" | grep -qi "Could not install the redis-cache plugin"
          echo "$out" | grep -qi "Could not install query-monitor"
          echo "$out" | grep -qi "Could not install wp-crontrol"
          echo "$out" | grep -qi "depfail.test is ready"

          sleep 1
          code=$(curl -sk --noproxy '*' -o /dev/null -w '%{http_code}' --resolve depfail.test:443:127.0.0.1 https://depfail.test/)
          [ "$code" = "200" ]

          docker exec wp-php82 sh -c "grep -v wordpress.org /etc/hosts > /tmp/hosts.new && cat /tmp/hosts.new > /etc/hosts && rm /tmp/hosts.new"
          printf 'depfail.test\n' | ./wpdev remove depfail

      - name: >
          Regression test -- clone must produce a valid nginx vhost
          (a past bug left the PHP_UPSTREAM placeholder unsubstituted,
          which silently invalidated nginx's entire config)
        run: |
          printf 'y\nn\n' | ./wpdev clone citest citest-clone
          docker exec wp-nginx nginx -t
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest-clone.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest-clone.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "clone HTTP $code"
          [ "$code" = "200" ]

      - name: >
          Regression test -- cron must run each site under its own PHP
          version, with no xdebug.log permission-race warnings
        run: |
          sleep 70
          cat logs/cron.log
          grep -q "citest (php8.2)" logs/cron.log
          grep -q "citest-clone (php8.2)" logs/cron.log
          ! grep -q "could not be opened" logs/cron.log
          ! grep -q "syntax error" logs/cron.log
          ! grep -qE "You are running 8\.[^2]" logs/cron.log

      - name: >
          Regression test -- restarting a phpXX container must not break
          nginx routing (a past bug cached the old container's IP until
          nginx was manually reloaded)
        run: |
          docker compose restart php82
          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --resolve citest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP after php82 restart, no nginx reload: $code"
          [ "$code" = "200" ]

      - name: >
          Regression test -- full-page cache must not silently drop the
          security headers (nginx's add_header inheritance rule replaces,
          not merges with, the server block's headers once a location
          defines its own -- found live while building this feature)
        run: |
          ./wpdev cache citest on
          docker exec wp-nginx nginx -t
          sleep 1
          code=$(curl -sk --resolve citest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://citest.test/)
          [ "$code" = "200" ]

          headers=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/)
          echo "$headers"
          echo "$headers" | grep -qi "^x-content-type-options:"
          echo "$headers" | grep -qi "^x-frame-options:"
          echo "$headers" | grep -qi "^x-fastcgi-cache:"

          # Second request should HIT; a cookie that looks logged-in should BYPASS.
          second=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$second" | grep -qi "HIT"
          bypassed=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 -b "wordpress_logged_in_x=1" https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$bypassed" | grep -qi "BYPASS"

          ./wpdev cache-purge
          purged=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$purged" | grep -qi "MISS"

          ./wpdev cache citest off
          docker exec wp-nginx nginx -t
          sleep 1
          off_headers=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/)
          ! echo "$off_headers" | grep -qi "^x-fastcgi-cache:"
          echo "$off_headers" | grep -qi "^x-content-type-options:"

      - name: >
          Regression test -- per-site cache TTL and extra bypass cookies
          (a dotted cookie name must come out escaped in the generated
          config, and a site with no .cache-ttl file at all must not
          silently die under set -e -- both found live while building this)
        run: |
          echo "5m" > sites/citest/.cache-ttl
          printf 'woocommerce_items_in_cart\nwp_woocommerce_session_*\nmy.custom.cookie\n' > sites/citest/.cache-bypass-cookies
          ./wpdev cache citest on
          docker exec wp-nginx nginx -t

          conf=nginx/sites/citest.test.conf
          grep -q "fastcgi_cache_valid 200 5m;" "$conf"
          grep -q 'my\\.custom\\.cookie' "$conf"

          sleep 1
          prefix_bypass=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 -b "wp_woocommerce_session_abc123=1" https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$prefix_bypass" | grep -qi "BYPASS"
          dot_bypass=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 -b "my.custom.cookie=1" https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$dot_bypass" | grep -qi "BYPASS"
          # If the dot were treated as a regex wildcard instead of literal,
          # this unrelated cookie (dots swapped for X) would also bypass.
          not_a_match=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 -b "myXcustomXcookie=1" https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$not_a_match" | grep -qi "HIT\|MISS"

          rm -f sites/citest/.cache-ttl sites/citest/.cache-bypass-cookies

          # Invalid input must fail loudly with a real message, not silently.
          # print_error writes to stdout (plain echo), not stderr -- redirect
          # accordingly, confirmed the hard way when 2> alone left this log
          # empty and the next line died on it under set -e.
          echo "bogus" > sites/citest/.cache-ttl
          if ./wpdev cache citest on >/tmp/cache_err.log 2>&1; then
            echo "expected 'wpdev cache citest on' to fail on an invalid .cache-ttl, but it succeeded"
            exit 1
          fi
          grep -qi "invalid .cache-ttl" /tmp/cache_err.log
          rm -f sites/citest/.cache-ttl

          # The actual regression: no .cache-ttl file at all (the normal
          # case for every site that hasn't set one) must enable cleanly.
          ./wpdev cache citest on
          docker exec wp-nginx nginx -t
          grep -q "fastcgi_cache_valid 200 60m;" "$conf"

          ./wpdev cache citest off
          docker exec wp-nginx nginx -t

      - name: >
          Regression test -- per-site bypass paths must be anchored, not
          loose substring (a bare /cart/ would also false-positive on
          /shop/cart/), and the sed delimiter must survive a path value
          that itself contains '/' (both found live while building this)
        run: |
          printf '/cart/\n/checkout/*\n' > sites/citest/.cache-bypass-paths
          ./wpdev cache citest on
          docker exec wp-nginx nginx -t

          conf=nginx/sites/citest.test.conf
          grep -q '\^/cart/\$' "$conf"
          grep -q '\^/checkout/' "$conf"

          sleep 1
          exact=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/cart/ | grep -i x-fastcgi-cache)
          echo "$exact" | grep -qi "BYPASS"
          prefix=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/checkout/payment/ | grep -i x-fastcgi-cache)
          echo "$prefix" | grep -qi "BYPASS"
          # The actual regression: without anchoring, both of these would
          # incorrectly bypass too.
          not_exact=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/shop/cart/ | grep -i x-fastcgi-cache)
          echo "$not_exact" | grep -qi "MISS\|HIT"
          not_prefix=$(curl -sk -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/my-cart-page/ | grep -i x-fastcgi-cache)
          echo "$not_prefix" | grep -qi "MISS\|HIT"

          rm -f sites/citest/.cache-bypass-paths
          ./wpdev cache citest off
          docker exec wp-nginx nginx -t

      - name: >
          Regression test -- nginx-helper must actually auto-purge on
          save, not just be installed. Verifies the shared fastcgi cache
          volume (nginx <-> phpXX) and the unlink_files config actually
          work end to end, not just that the plugin exists.
        run: |
          ./wpdev cache citest on
          docker exec wp-nginx nginx -t

          plugins=$(./wpdev wp citest plugin list --field=name --status=active)
          echo "$plugins" | grep -qx "nginx-helper"
          grep -q "RT_WP_NGINX_HELPER_CACHE_PATH" sites/citest/wp-config.php

          sleep 1
          r() { curl -sk --noproxy '*' -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/ | grep -i x-fastcgi-cache; }

          post_id=$(./wpdev wp citest post create --post_title="CI test post" --post_status=publish --porcelain)
          sleep 1
          r | grep -qi "MISS"
          r | grep -qi "HIT"

          ./wpdev wp citest post update "$post_id" --post_title="CI test post updated"
          sleep 1
          r | grep -qi "MISS"

          ./wpdev cache citest off
          docker exec wp-nginx nginx -t
          ./wpdev wp citest plugin list --field=name --status=active | ( ! grep -qx "nginx-helper" )

      - name: >
          Regression test -- core caching must not depend on nginx-helper
          actually installing. Forces a real network failure (not a code
          path trick) inside the php82 container specifically -- the
          runner's own /etc/hosts doesn't affect container DNS at all,
          each container has its own -- then confirms caching still works
          and the command doesn't abort (found live: an unguarded failure
          here aborted before the nginx reload ever ran, leaving the
          vhost regenerated on disk but never actually loaded)
        run: |
          # Must actually uninstall nginx-helper first (the previous test
          # step already installed it successfully, and `cache off` only
          # deactivates, never uninstalls) -- otherwise `wp plugin
          # is-installed` finds it already present and takes the
          # activate-only branch, which needs no network at all, silently
          # never exercising the install path this test exists to break.
          # Clearing wp-cli's own plugin zip cache too, or the install
          # succeeds from a previously-downloaded copy regardless of the
          # network being down. Both confirmed the hard way.
          ./wpdev wp citest plugin delete nginx-helper 2>/dev/null || true
          # wp-cli runs as www-data (#20), whose cache is under its home,
          # /var/www; root's is cleared too for older images.
          docker exec wp-php82 sh -c 'rm -rf /root/.wp-cli/cache/plugin/ "$(getent passwd www-data | cut -d: -f6)/.wp-cli/cache/plugin/"'
          docker exec wp-php82 sh -c "echo '127.0.0.1 wordpress.org downloads.wordpress.org' >> /etc/hosts"

          out=$(./wpdev cache citest on 2>&1)
          echo "$out"
          echo "$out" | grep -qi "Could not set up nginx-helper"
          docker exec wp-nginx nginx -t

          sleep 1
          code=$(curl -sk --noproxy '*' -o /dev/null -w '%{http_code}' --resolve citest.test:443:127.0.0.1 https://citest.test/)
          [ "$code" = "200" ]
          r=$(curl -sk --noproxy '*' -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/ | grep -i x-fastcgi-cache)
          echo "$r" | grep -qi "HIT\|MISS"
          ./wpdev wp citest plugin list --field=name --status=active | ( ! grep -qx "nginx-helper" )

          # /etc/hosts inside a container can't be sed -i'd (it's a special
          # bind-mounted file, "Device or resource busy" on rename) --
          # overwrite its content in place instead.
          docker exec wp-php82 sh -c "grep -v wordpress.org /etc/hosts > /tmp/hosts.new && cat /tmp/hosts.new > /etc/hosts && rm /tmp/hosts.new"
          ./wpdev cache citest off
          docker exec wp-nginx nginx -t

      - name: >
          Regression test -- a site missing .php-version (predates
          multi-PHP support) must not silently break status/list/creds
          for every OTHER site too (found live: it died mid-loop)
        run: |
          echo "# fake site, no .php-version on purpose" > nginx/sites/phptest.test.conf
          mkdir -p sites/phptest
          ./wpdev status | tee /tmp/status.log
          grep -q "citest.test" /tmp/status.log
          grep -q "citest-clone.test" /tmp/status.log
          ./wpdev list | tee /tmp/list.log
          grep -q "citest" /tmp/list.log
          ./wpdev creds phptest
          rm -f nginx/sites/phptest.test.conf
          rm -rf sites/phptest

      - name: >
          Regression test -- www-data (the real PHP-FPM user, i.e. a
          plugin/theme install triggered from wp-admin in a browser) must
          be able to create its own directories under wp-content/upgrade
          and wp-content/plugins. Found live on wp-lab: everything wp-cli
          writes during provisioning runs as root (docker compose exec
          defaults to root), so without the chgrp+setgid fix in `wpdev
          add`, www-data had no write access at all and a real wp-admin
          plugin install failed with WP-CLI/WordPress's own "Installation
          failed: Could not create directory."
        run: |
          docker exec -u www-data wp-php82 sh -c "
            set -e
            mkdir -p /var/www/citest/wp-content/upgrade/permtest
            mkdir -p /var/www/citest/wp-content/plugins/permtest
            rmdir /var/www/citest/wp-content/upgrade/permtest
            rmdir /var/www/citest/wp-content/plugins/permtest
          "

      - name: >
          Regression test -- every file in a site is owned by the developer,
          whoever writes it (#20), and a page save in PHP-FPM purges the
          full-page cache (#21). wp-cli used to write as root and PHP-FPM as
          uid 33, each read-only to the other: wp-admin updates failed with
          "Could not create the upgrade-temp-backup directory", and
          nginx-helper couldn't delete nginx's cache files.
        run: |
          me=$(id -u)
          for svc in php81 php82 php83 php84; do
            [ "$(docker exec wp-$svc id -u www-data)" = "$me" ]
          done
          [ "$(docker exec wp-nginx id -u nginx)" = "$me" ]
          grep -q ' www-data /usr/local/bin/wp-cron-runner.sh' <(docker exec wp-php82 cat /etc/cron.d/wp-cron)
          [ "$(stat -c %u logs/cron.log)" = "$me" ]

          # A freshly provisioned site has nothing you don't own.
          [ -z "$(find sites/citest \( ! -user "$me" -o ! -perm -u+w \) -print -quit)" ]

          # What PHP-FPM writes in a real request is yours, and deletable.
          echo '<?php @mkdir(__DIR__."/wp-content/uploads", 0755, true); file_put_contents(__DIR__."/wp-content/uploads/fpm-probe.txt", "x"); echo posix_getuid();' > sites/citest/fpm-probe.php
          [ "$(curl -sk --noproxy '*' --resolve citest.test:443:127.0.0.1 https://citest.test/fpm-probe.php)" = "$me" ]
          [ "$(stat -c %u sites/citest/wp-content/uploads/fpm-probe.txt)" = "$me" ]
          rm sites/citest/fpm-probe.php sites/citest/wp-content/uploads/fpm-probe.txt

          # A site copied in from elsewhere: a root-owned 755 directory, like
          # the upgrade-temp-backup that triggered #20. doctor flags it, PHP
          # can't write into it, fix-perms hands it back.
          docker exec wp-php82 sh -c 'mkdir -m 755 /var/www/citest/wp-content/upgrade-temp-backup && touch /var/www/citest/wp-content/upgrade-temp-backup/old'
          ./wpdev doctor | grep -q "Run: wpdev fix-perms citest"
          ! docker exec -u www-data wp-php82 mkdir /var/www/citest/wp-content/upgrade-temp-backup/plugins 2>/dev/null
          ./wpdev fix-perms citest
          docker exec -u www-data wp-php82 mkdir /var/www/citest/wp-content/upgrade-temp-backup/plugins
          ! ./wpdev doctor | grep -q "Run: wpdev fix-perms citest"
          rm -rf sites/citest/wp-content/upgrade-temp-backup

          # Through the api too (dashboard button).
          curl -sf -X POST http://127.0.0.1:39006/api/sites/citest/fix-perms | grep -q '"code":0'

          # Save a post inside PHP-FPM, the way wp-admin does: nginx-helper
          # must delete the cached page.
          ./wpdev cache citest on
          r() { curl -sk --noproxy '*' -D - -o /dev/null --resolve citest.test:443:127.0.0.1 https://citest.test/ | grep -i x-fastcgi-cache; }
          post_id=$(./wpdev wp citest post create --post_title="FPM purge test" --post_status=publish --porcelain)
          sleep 1
          r | grep -qi "MISS"
          r | grep -qi "HIT"
          echo "<?php require __DIR__.'/wp-load.php'; wp_update_post(['ID'=>${post_id},'post_title'=>'FPM purge test updated']); echo 'ok';" > sites/citest/purge-probe.php
          curl -sk --noproxy '*' --resolve citest.test:443:127.0.0.1 https://citest.test/purge-probe.php | grep -qx ok
          rm sites/citest/purge-probe.php
          sleep 1
          r | grep -qi "MISS"
          ./wpdev wp citest post delete "$post_id" --force
          ./wpdev cache citest off

      - name: >
          Regression test -- add/remove/restore/clone/db-import/snapshots
          accept --domain=/--php=/--yes for non-interactive (API-driven) use.
          Every one of these previously called a bare `read -p` with no
          `|| true`, which aborts the whole run under `set -e` the moment
          stdin isn't a real TTY -- exactly the environment an HTTP API
          wrapping this script would run in. A separate throwaway site, not
          citest -- its own plugin/cache state is checked by other steps
          and shouldn't be disturbed.
        run: |
          out=$(./wpdev add --domain=flagtest.test --php=8.1 </dev/null 2>&1)
          echo "$out"
          echo "$out" | grep -qi "Skipping confirmation (--domain given"
          echo "$out" | grep -qi "flagtest.test is ready"
          [ "$(cat sites/flagtest/.php-version)" = "8.1" ]

          ./wpdev snapshot flagtest headless </dev/null
          ./wpdev snapshots flagtest </dev/null | grep -q "headless"

          ./wpdev restore flagtest --yes </dev/null

          # db-import and clone had the exact same bare-`read -p` bug as the
          # others above, just not caught until the API's own endpoints for
          # them actually exercised it live -- a --yes flag that only covers
          # some of a tool's confirmation prompts isn't actually done.
          ./wpdev db-export flagtest /tmp/flagtest.sql.gz </dev/null
          ./wpdev db-import flagtest /tmp/flagtest.sql.gz --yes </dev/null
          rm -f /tmp/flagtest.sql.gz

          ./wpdev clone flagtest flagtest-clone --yes </dev/null
          ./wpdev remove flagtest-clone --yes </dev/null

          ./wpdev remove flagtest --yes </dev/null
          rm -rf snapshots/flagtest
          ! ./wpdev list | grep -q flagtest.test

      - name: >
          Regression test -- the api service (thin HTTP wrapper around
          wpdev, for a GUI or other automation) actually works end to end:
          reachable over HTTP, a real site provisions/responds/gets removed
          through it via SSE, and -- the actual bug this caught live while
          building it -- files it writes directly (not through a separate
          `docker compose exec` into another container, which has its own
          ownership story) land owned by the real user, not root. Without
          the entrypoint's privilege drop, `wpdev snapshot` run through
          this container left root-owned files under snapshots/ that the
          host user couldn't even `rm` without sudo.
        run: |
          curl -sf http://127.0.0.1:39006/api/health
          echo

          curl -s http://127.0.0.1:39006/api/status | grep -q '"code":0'

          # Regression test -- /api/system/stats reads /proc/meminfo,
          # /proc/stat, and `df` on the bind-mounted project path from
          # inside this container. Confirmed by hand (not assumed) that
          # these reflect the real host, not a cgroup-scoped view of it --
          # this just asserts the endpoint returns plausible numbers, not
          # that they match the runner (which this job doesn't control).
          curl -s http://127.0.0.1:39006/api/system/stats | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 0 <= d['cpu']['percent'] <= 100, d
          assert d['cpu']['cores'] >= 1, d
          assert 0 <= d['memory']['percent'] <= 100, d
          assert d['memory']['totalBytes'] > 0, d
          assert 0 <= d['disk']['percent'] <= 100, d
          assert d['disk']['totalBytes'] > 0, d
          print('system stats OK')
          "

          # Regression test -- /api/update-check (`wpdev update-check`
          # under the hood) needs `git` inside this container, which
          # node:20-slim doesn't ship with -- without it, every call here
          # fails at the first line with "Not a git checkout", regardless
          # of the real git state of the bind-mounted project. Not
          # asserting updateAvailable either way (this runner's checkout
          # may or may not be behind origin, and that's not what this
          # guards); just that the git-missing regression is gone and the
          # endpoint returns well-formed JSON. printf, not echo -- echo's
          # backslash handling isn't consistent across shells, and the
          # response's stdout field contains a real \n escape sequence.
          check=$(curl -s http://127.0.0.1:39006/api/update-check)
          printf '%s\n' "$check"
          ! printf '%s' "$check" | grep -qi "not a git checkout"
          printf '%s' "$check" | python3 -c "import json, sys; json.load(sys.stdin)"

          add_out=$(curl -N -s -X POST http://127.0.0.1:39006/api/sites \
            -H "Content-Type: application/json" \
            -d '{"domain":"apicitest.test","php":"8.2"}' --max-time 120)
          echo "$add_out" | grep -qi "apicitest.test is ready"
          echo "$add_out" | grep -q '"code":0'

          code=""
          for i in $(seq 1 10); do
            code=$(curl -sk --noproxy '*' --resolve apicitest.test:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://apicitest.test/ 2>/dev/null) && [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code"
          [ "$code" = "200" ]

          # The actual regression: these must be owned by the CI runner's
          # own user, not root.
          owner=$(stat -c "%U" nginx/sites/apicitest.test.conf)
          echo "nginx config owned by: $owner"
          [ "$owner" != "root" ]

          curl -s http://127.0.0.1:39006/api/sites/apicitest/creds | grep -qi "Site: apicitest"

          remove_out=$(curl -N -s -X DELETE http://127.0.0.1:39006/api/sites/apicitest --max-time 60)
          echo "$remove_out" | grep -qi "apicitest.test removed"

          ! ./wpdev list | grep -q apicitest.test

      - name: >
          Regression test -- the dashboard (React GUI for the api service,
          started by `wpdev up` above) serves its built assets and renders
          the right API_PORT into config.js. Not a full browser E2E test
          (the dashboard is a thin client over the api service already
          covered above, and was verified by hand in a real browser while
          building it) -- this just catches a broken build or a
          docker-entrypoint.sh/envsubst regression.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:39007/)
          [ "$code" = "200" ]

          curl -s http://127.0.0.1:39007/ | grep -qi "<title>wp-local-dev</title>"
          curl -s http://127.0.0.1:39007/config.js | grep -q 'http://localhost:39006'

          # Regression test -- `wpdev up` (run above) must have synced a real
          # `git describe` into .env's APP_VERSION and docker-entrypoint.sh
          # must have envsubst'd it into config.js, same mechanism as
          # API_PORT above. Not asserting on the exact format (whether this
          # checkout's tags were fetched affects whether it's a full
          # "vX.Y.Z-N-gHASH" or just the bare short hash) -- just that
          # something real landed, not an empty string or the literal
          # unsubstituted placeholder a missing envsubst allow-list entry
          # would leave behind.
          config=$(curl -s http://127.0.0.1:39007/config.js)
          echo "$config" | grep -qE '__WPDEV_APP_VERSION__ = "[^"]+"'
          ! echo "$config" | grep -q '__WPDEV_APP_VERSION__ = "unknown"'
          ! echo "$config" | grep -q '\${APP_VERSION}'

          # Regression test -- the Docs page bundles the real README.md at
          # build time (Dockerfile must copy it to the same relative depth
          # as local dev expects, see DocsPage.jsx's `?raw` import). Grep the
          # built JS for actual README prose (not a source comment -- the
          # build minifies those away) to catch a stale or empty bundle.
          js_path=$(curl -s http://127.0.0.1:39007/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
          curl -s "http://127.0.0.1:39007$js_path" | grep -q "Multi-site, multi-PHP"

      - name: >
          Regression test -- `wpdev add --wp-version=` actually installs
          the requested version, not just accepts the flag. Switched the
          download step from a manual curl+tar+mv to `wp core download
          --version=`, so this also covers that `wp core download` runs
          correctly against a just-started php container (it's step 3,
          right after step 1 brings mysql/php/redis up).
        run: |
          ./wpdev add --domain=wpvertest.test --php=8.2 --wp-version=6.4.3 </dev/null
          [ "$(./wpdev wp wpvertest core version)" = "6.4.3" ]
          ./wpdev remove wpvertest --yes </dev/null

      - name: >
          Regression test -- status run through the api reports real
          reachability (#6). It used to curl the api container's own
          loopback, which isn't nginx, so every site showed 000.
        run: |
          out=$(curl -s http://127.0.0.1:39006/api/status | python3 -c 'import json,sys; print(json.load(sys.stdin)["stdout"])')
          echo "$out"
          echo "$out" | grep -E '^citest\.test ' | grep -qw 200

      - name: >
          Regression test -- a non-default NGINX_HTTPS_PORT works end to end
          (#5). WP_HOME/WP_SITEURL, the install --url, clone, status and the
          dashboard's links all used to assume :443, so WordPress redirected
          every request to a port nothing listened on.
        run: |
          restore() {
            sed -i 's/^NGINX_HTTPS_PORT=.*/NGINX_HTTPS_PORT=443/' .env
            docker compose up -d nginx dashboard >/dev/null 2>&1
          }
          trap restore EXIT
          sed -i 's/^NGINX_HTTPS_PORT=.*/NGINX_HTTPS_PORT=8444/' .env
          docker compose up -d nginx dashboard

          ./wpdev add --domain=porttest.test --php=8.2 </dev/null
          ./wpdev clone porttest portclone --yes </dev/null
          grep -q "'https://porttest.test:8444'" sites/porttest/wp-config.php

          probe() {
            curl -sk --noproxy '*' --connect-to "$1:8444:127.0.0.1:8444" \
              -o /dev/null -w '%{http_code} %{redirect_url}' "https://$1:8444$2"
          }
          for site in porttest.test portclone.test; do
            code=""
            for i in $(seq 1 10); do
              code=$(probe "$site" /) && [ "$code" = "200 " ] && break
              sleep 1
            done
            echo "$site / -> $code"
            [ "$code" = "200 " ]
            r=$(probe "$site" /wp-admin/)
            echo "$site /wp-admin/ -> $r"
            echo "$r" | grep -q "https://${site}:8444/wp-login.php"
          done
          ! docker compose exec -T php82 wp --path=/var/www/portclone --allow-root \
              post list --post_type=any --fields=guid --format=csv | grep -q '8444:8444'

          ./wpdev status | grep -E '^porttest\.test ' | grep -qw 200
          ./wpdev list | grep -q 'https://porttest.test:8444'
          curl -s http://127.0.0.1:39007/config.js | grep -q '__WPDEV_HTTPS_PORT__ = "8444"'

          ./wpdev remove portclone --yes </dev/null
          ./wpdev remove porttest --yes </dev/null

      - name: >
          Regression test -- `wpdev up` shares the host's mkcert CA with the
          api (#10). Without MKCERT_CAROOT, sites created from the dashboard
          got certs from the api container's own private CA, which no browser
          trusts. .env.example ships it commented out, so the "Start the
          stack" step above must have filled it in.
        run: |
          grep -qx "MKCERT_CAROOT=$(mkcert -CAROOT)" .env
          docker exec wp-api test -f /mkcert-ca/rootCA.pem
          cmp <(docker exec wp-api cat /mkcert-ca/rootCA.pem) "$(mkcert -CAROOT)/rootCA.pem"

      - name: >
          Regression test -- `doctor` flags a cert from the wrong CA, and
          `wpdev cert` (CLI and api) reissues it from the trusted one (#11).
          Until now the only fix was deleting the files and running mkcert by
          hand.
        run: |
          served_serial() {
            echo | openssl s_client -connect 127.0.0.1:443 -servername citest.test 2>/dev/null \
              | openssl x509 -noout -serial
          }
          bad=$(mktemp -d)
          CAROOT="$bad" mkcert -cert-file nginx/ssl/certs/citest.test.pem \
            -key-file nginx/ssl/private/citest.test-key.pem citest.test
          docker exec wp-nginx nginx -s reload
          ./wpdev doctor | grep -q "wasn't issued by the current mkcert CA"

          ./wpdev cert citest
          ! ./wpdev doctor | grep -q "wasn't issued by the current mkcert CA"
          sleep 1
          curl -sf --noproxy '*' --resolve citest.test:443:127.0.0.1 -o /dev/null https://citest.test/

          before=$(served_serial)
          curl -sf -X POST http://127.0.0.1:39006/api/sites/citest/cert | grep -q '"code":0'
          sleep 1
          [ "$(served_serial)" != "$before" ]
          curl -sf --noproxy '*' --resolve citest.test:443:127.0.0.1 -o /dev/null https://citest.test/
          [ "$(stat -c %u nginx/ssl/certs/citest.test.pem)" = "$(id -u)" ]
          rm -rf "$bad"

      - name: >
          Regression test -- containers left by an interrupted recreate are
          reported by doctor and removed by `wpdev up` (#12). Compose leaves a
          never-started <id>_wp-<service> behind when the recreating process
          dies mid-way, and nothing used to notice.
        run: |
          docker create --name abcdef123456_wp-ci "$(docker inspect -f '{{.Config.Image}}' wp-redis)"
          ./wpdev doctor | grep -q 'abcdef123456_wp-ci'
          # Captured, not piped into grep -q: grep exiting at the first
          # match would SIGPIPE `up` partway through its work.
          out=$(./wpdev up 2>&1); echo "$out"
          echo "$out" | grep -q 'interrupted recreate'
          ! docker ps -a --format '{{.Names}}' | grep -q abcdef123456_wp-ci

      - name: >
          Regression test -- an Up from the dashboard applies the api's own
          config change through a detached helper container (#13). Since #4
          the api can't recreate itself mid-request, and it used to only warn
          and leave the change unapplied.
        run: |
          wait_for_new_api() {
            for i in $(seq 1 90); do
              sleep 1
              id=$(docker inspect -f '{{.Id}}' wp-api 2>/dev/null) || continue
              [ "$id" != "$1" ] && curl -sf -o /dev/null http://127.0.0.1:39006/api/health && return 0
            done
            cat logs/api-updater.log || true
            return 1
          }
          # The host `up` in the step above may itself have just recreated
          # the api (earlier steps edit .env, which it loads).
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:39006/api/health && break; sleep 1; done
          before=$(docker inspect -f '{{.Id}}' wp-api)
          echo 'WPDEV_SELF_UPDATE_TEST=1' >> .env
          resp=$(curl -s -X POST http://127.0.0.1:39006/api/stack/up); echo "$resp"
          echo "$resp" | grep -q 'api restarts itself'
          wait_for_new_api "$before"
          docker exec wp-api printenv WPDEV_SELF_UPDATE_TEST
          cat logs/api-updater.log
          grep -q 'exit 0' logs/api-updater.log
          ! docker ps -a --format '{{.Names}}' | grep -qE 'wpdev-api-updater|^[0-9a-f]{12}_wp-'

          before=$(docker inspect -f '{{.Id}}' wp-api)
          sed -i '/^WPDEV_SELF_UPDATE_TEST=1$/d' .env
          resp=$(curl -s -X POST http://127.0.0.1:39006/api/stack/up); echo "$resp"
          echo "$resp" | grep -q 'api restarts itself'
          wait_for_new_api "$before"
          ! docker exec wp-api printenv WPDEV_SELF_UPDATE_TEST

      - name: >
          Regression test -- declining a confirmation exits non-zero (#7).
          `add` used to print "Cancelled." and exit 0, which let a shifted
          piped answer silently skip provisioning in this very workflow.
        run: |
          rc=0
          out=$(printf 'canceltest.test\n8.2\n\nn\n' | ./wpdev add 2>&1) || rc=$?
          echo "$out"
          echo "$out" | grep -q "Cancelled."
          [ "$rc" -ne 0 ]
          [ ! -e sites/canceltest ]

      - name: >
          Regression test -- inside the api container, stack commands fail
          closed when the service list can't be read (#8). An empty list
          used to mean "every service", wp-api included -- the self-kill #4
          fixed. Uses a scratch copy with a broken compose file, so nothing
          real is touched.
        run: |
          d=$(mktemp -d)
          cp wpdev "$d/"
          echo 'services: [' > "$d/docker-compose.yml"
          touch "$d/.env"
          for cmd in up restart down update; do
            rc=0
            out=$(cd "$d" && WPDEV_IN_API=1 ./wpdev "$cmd" 2>&1) || rc=$?
            echo "$cmd: rc=$rc $out"
            [ "$rc" -ne 0 ]
            echo "$out" | grep -q "can't safely leave the api container out"
          done
          rm -rf "$d"
          docker inspect -f '{{.State.Running}}' wp-api | grep -qx true

      - name: Remove both sites and confirm doctor reports no failures
        run: |
          printf 'citest-clone.test\n' | ./wpdev remove citest-clone
          printf 'citest.test\n' | ./wpdev remove citest
          ./wpdev doctor | tee /tmp/doctor2.log
          ! grep -q "thing(s) need fixing" /tmp/doctor2.log

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "--- docker compose ps ---"
          docker compose ps
          echo "--- cron.log ---"
          cat logs/cron.log 2>/dev/null || true
          echo "--- nginx error log ---"
          cat logs/nginx/*error.log 2>/dev/null || true
          echo "--- doctor ---"
          ./wpdev doctor || true

      - name: Tear down
        if: always()
        run: docker compose down -v --rmi local
