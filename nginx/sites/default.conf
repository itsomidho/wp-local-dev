# Default catch-all
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Admin domains (`wpdev admin-domain`): one file per site that has one.
# Included from here rather than nginx.conf because nginx/sites is a
# directory mount, so a `git pull` reaches a running nginx; nginx.conf is a
# single-file mount that keeps the old file until the container is
# recreated. The [f] makes it a glob, which matches nothing when no site
# has an admin domain.
include /etc/nginx/sites/admin-domain/*.con[f];
